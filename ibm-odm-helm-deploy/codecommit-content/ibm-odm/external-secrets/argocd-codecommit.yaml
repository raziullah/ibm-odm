# ESO reads HTTPS Git credentials from Secrets Manager and creates an Argo CD repository Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ibm-odm-codecommit
  namespace: openshift-gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ibm-odm-codecommit
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: REPLACE_CODECOMMIT_URL
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: REPLACE_CODECOMMIT_GIT_SECRET_ARN
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_CODECOMMIT_GIT_SECRET_ARN
        property: password
