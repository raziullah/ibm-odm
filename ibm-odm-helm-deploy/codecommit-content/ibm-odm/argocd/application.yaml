apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ibm-odm
  namespace: openshift-gitops
spec:
  project: ibm-odm
  source:
    repoURL: REPLACE_CODECOMMIT_URL
    targetRevision: main
    path: ibm-odm/chart/ibm-odm-prod
    helm:
      releaseName: ibm-odm
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ibm-odm
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
